<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <!-- Supabase CDN — must load before any of your JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Image compression -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="./styles.css">

</head>

<body>

  <!-- ===================== -->
  <!-- DASHBOARD UI ONLY -->
  <!-- ===================== -->

  <h1>CMS Dashboard</h1>

  <!-- DRAG & DROP AREA -->
  <div id="dropZone" class="drop-zone">
  <p>Drag & drop image here or click to select</p>
  <input 
  type="file" 
  id="uploadInput" 
  multiple 
  accept="image/*,video/*" 
  hidden
/>
</div>

<button id="uploadBtn">Upload</button>

  <!-- UPLOAD STATUS -->
  <div id="uploadStatus"></div>

  <!-- GALLERY -->
  <div id="adminGallery" class="admin-grid"></div>

  <button id="logoutBtn">Logout</button>

  <!-- ===================== -->
  <!-- SCRIPTS (ORDER MATTERS) -->
  <!-- Must be at end of body so DOM elements exist when scripts run.
       Supabase CDN is in <head> so it's ready by the time these execute. -->
  <!-- ===================== -->
  <script src="./js/supabase.js"></script>   <!-- sets up window.supabaseClient -->
  <script src="./js/auth.js"></script>        <!-- depends on supabaseClient -->
  <script src="./js/dashboard.js"></script>   <!-- depends on supabaseClient -->
  <script src="./js/gallery-upload.js"></script> <!-- depends on supabaseClient + DOM -->
  <script src="./js/logout.js"></script>      <!-- depends on supabaseClient -->

</body>
</html>
