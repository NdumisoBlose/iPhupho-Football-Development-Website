<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Academy | Gallery</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>
<script src="./js/gallery-upload.js"></script>
<script src="./js/gallery.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  
  
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html" class="logo">
      <img src="Logo.jpg" alt="Soccer Academy Logo"></a></div>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
  </nav>

  <section class="container">
    <h2>Gallery</h2>
    <div id="gallery">
    </div>
    

  </div>
  </section>


<script>
window.addEventListener("DOMContentLoaded", async () => {

  const container = document.getElementById("gallery")

  if (!container) {
    console.error("Gallery container missing")
    return
  }

  const { data, error } =
    await window.supabaseClient
      .from("gallery_images")
      .select("*")
      .order("uploaded_at", { ascending: false })

  if (error) {
    console.error("Failed to load gallery:", error)
    return
  }

  container.innerHTML = ""

  data.forEach(item => {

    const img = document.createElement("img")

    img.src = item.image_url
    img.alt = item.title || "Gallery image"
    img.loading = "lazy"

    container.appendChild(img)
  })
})

      </script>
      
  <footer>
    <p>&copy; 2024 iPhupho Football Develeopment. All rights reserved.</p>
  </footer>
</body>
</html>
